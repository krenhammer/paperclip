    char_count: 1176
  adapters/overview:
    title: Adapters Overview
    description: What adapters are and how they connect agents to Paperclip
    category: Adapters
    url_path: /adapters/overview
    content: 'Adapters are the bridge between Paperclip''s orchestration layer and
      agent runtimes. Each adapter knows how to invoke a specific type of AI agent
      and capture its results.


      ## How Adapters Work


      When a heartbeat fires, Paperclip:


      1. Looks up the agent''s adapterType and adapterConfig

      2. Calls the adapter''s execute() function with the execution context

      3. The adapter spawns or calls the agent runtime

      4. The adapter captures stdout, parses usage/cost data, and returns a structured
      result


      ## Built-in Adapters


      | Adapter | Type Key | Description |

      |---------|----------|-------------|

      | [Claude Local](/adapters/claude-local) | claude_local | Runs Claude Code CLI
      locally |

      | [Codex Local](/adapters/codex-local) | codex_local | Runs OpenAI Codex CLI
      locally |

      | [Gemini Local](/adapters/gemini-local) | gemini_local | Runs Gemini CLI locally
      |

      | OpenCode Local | opencode_local | Runs OpenCode CLI locally (multi-provider
      provider/model) |

      | Cursor Local | cursor | Runs Cursor CLI locally |

      | OpenClaw Gateway | openclaw_gateway | Sends wake payloads to an OpenClaw gateway
      |

      | Hermes Local | hermes_local | Runs Hermes Agent CLI locally |

      | Pi Local | pi_local | Runs Pi CLI locally |

      | [Process](/adapters/process) | process | Executes arbitrary shell commands
      |

      | [HTTP](/adapters/http) | http | Sends webhooks to external agents |


      ## Adapter Architecture


      Each adapter is a package with three modules:


      [code example]


      Three registries consume these modules:


      | Registry | What it does |

      |----------|-------------|

      | **Server** | Executes agents, captures results |

      | **UI** | Renders run transcripts, provides config forms |

      | **CLI** | Formats terminal output for live watching |


      ## Choosing an Adapter


      - **Need a coding agent?** Use claude_local, codex_local, gemini_local, or opencode_local

      - **Need to run a script or command?** Use process

      - **Need to call an external service?** Use http

      - **Need something custom?** [Create your own adapter](/adapters/creating-an-adapter)'
    word_count: 301
    char_count: 1990
  adapters/process:
    title: Process Adapter
    description: Generic shell process adapter
    category: Adapters
    url_path: /adapters/process
    content: 'The process adapter executes arbitrary shell commands. Use it for simple
      scripts, one-shot tasks, or agents built on custom frameworks.


      ## When to Use


      - Running a Python script that calls the Paperclip API

      - Executing a custom agent loop

      - Any runtime that can be invoked as a shell command


      ## When Not to Use


      - If you need session persistence across runs (use claude_local or codex_local)

      - If the agent needs conversational context between heartbeats


      ## Configuration


      | Field | Type | Required | Description |

      |-------|------|----------|-------------|

      | command | string | Yes | Shell command to execute |

      | cwd | string | No | Working directory |

      | env | object | No | Environment variables |

      | timeoutSec | number | No | Process timeout |


      ## How It Works


      1. Paperclip spawns the configured command as a child process

      2. Standard Paperclip environment variables are injected (PAPERCLIP_AGENT_ID,
      PAPERCLIP_API_KEY, etc.)

      3. The process runs to completion

      4. Exit code determines success/failure


      ## Example


      An agent that runs a Python script:


      [code example]


      The script can use the injected environment variables to authenticate with the
      Paperclip API and perform work.'
