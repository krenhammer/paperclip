  agents-runtime:
    title: Agents Runtime
    description: null
    category: Getting Started
    url_path: /agents-runtime
    content: "# Agent Runtime Guide\n\nStatus: User-facing guide  \nLast updated:\
      \ 2026-02-17  \nAudience: Operators setting up and running agents in Paperclip\n\
      \n## 1. What this system does\n\nAgents in Paperclip do not run continuously.\
      \  \nThey run in **heartbeats**: short execution windows triggered by a wakeup.\n\
      \nEach heartbeat:\n\n1. Starts the configured agent adapter (for example, Claude\
      \ CLI or Codex CLI)\n2. Gives it the current prompt/context\n3. Lets it work\
      \ until it exits, times out, or is cancelled\n4. Stores results (status, token\
      \ usage, errors, logs)\n5. Updates the UI live\n\n## 2. When an agent wakes\
      \ up\n\nAn agent can be woken up in four ways:\n\n- timer: scheduled interval\
      \ (for example every 5 minutes)\n- assignment: when work is assigned/checked\
      \ out to that agent\n- on_demand: manual wakeup (button/API)\n- automation:\
      \ system-triggered wakeup for future automations\n\nIf an agent is already running,\
      \ new wakeups are merged (coalesced) instead of launching duplicate runs.\n\n\
      ## 3. What to configure per agent\n\n## 3.1 Adapter choice\n\nCommon choices:\n\
      \n- claude_local: runs your local claude CLI\n- codex_local: runs your local\
      \ codex CLI\n- process: generic shell command adapter\n- http: calls an external\
      \ HTTP endpoint\n\nFor claude_local and codex_local, Paperclip assumes the CLI\
      \ is already installed and authenticated on the host machine.\n\n## 3.2 Runtime\
      \ behavior\n\nIn agent runtime settings, configure heartbeat policy:\n\n- enabled:\
      \ allow scheduled heartbeats\n- intervalSec: timer interval (0 = disabled)\n\
      - wakeOnAssignment: wake when assigned work\n- wakeOnOnDemand: allow ping-style\
      \ on-demand wakeups\n- wakeOnAutomation: allow system automation wakeups\n\n\
      ## 3.3 Working directory and execution limits\n\nFor local adapters, set:\n\n\
      - cwd (working directory)\n- timeoutSec (max runtime per heartbeat)\n- graceSec\
      \ (time before force-kill after timeout/cancel)\n- optional env vars and extra\
      \ CLI args\n- use **Test environment** in agent configuration to run adapter-specific\
      \ diagnostics before saving\n\n## 3.4 Prompt templates\n\nYou can set:\n\n-\
      \ promptTemplate: used for every run (first run and resumed sessions)\n\nTemplates\
      \ support variables like {}, {}, and run context values.\n\n## 4. Session resume\
      \ behavior\n\nPaperclip stores session IDs for resumable adapters.\n\n- Next\
      \ heartbeat reuses the saved session automatically.\n- This gives continuity\
      \ across heartbeats.\n- You can reset a session if context gets stale or confused.\n\
      \nUse session reset when:\n\n- you significantly changed prompt strategy\n-\
      \ the agent is stuck in a bad loop\n- you want a clean restart\n\n## 5. Logs,\
      \ status, and run history\n\nFor each heartbeat run you get:\n\n- run status\
      \ (queued, running, succeeded, failed, timed_out, cancelled)\n- error text and\
      \ stderr/stdout excerpts\n- token usage/cost when available from the adapter\n\
      - full logs (stored outside core run rows, optimized for large output)\n\nIn\
      \ local/dev setups, full logs are stored on disk under the configured run-log\
      \ path.\n\n## 6. Live updates in the UI\n\nPaperclip pushes runtime/activity\
      \ updates to the browser in real time.\n\nYou should see live changes for:\n\
      \n- agent status\n- heartbeat run status\n- task/activity updates caused by\
      \ agent work\n- dashboard/cost/activity panels as relevant\n\nIf the connection\
      \ drops, the UI reconnects automatically.\n\n## 7. Common operating patterns\n\
      \n## 7.1 Simple autonomous loop\n\n1. Enable timer wakeups (for example every\
      \ 300s)\n2. Keep assignment wakeups on\n3. Use a focused prompt template\n4.\
      \ Watch run logs and adjust prompt/config over time\n\n## 7.2 Event-driven loop\
      \ (less constant polling)\n\n1. Disable timer or set a long interval\n2. Keep\
      \ wake-on-assignment enabled\n3. Use on-demand wakeups for manual nudges\n\n\
      ## 7.3 Safety-first loop\n\n1. Short timeout\n2. Conservative prompt\n3. Monitor\
      \ errors + cancel quickly when needed\n4. Reset sessions when drift appears\n\
      \n## 8. Troubleshooting\n\nIf runs fail repeatedly:\n\n1. Check adapter command\
      \ availability (claude/codex installed and logged in).\n2. Verify cwd exists\
      \ and is accessible.\n3. Inspect run error + stderr excerpt, then full log.\n\
      4. Confirm timeout is not too low.\n5. Reset session and retry.\n6. Pause agent\
      \ if it is causing repeated bad updates.\n\nTypical failure causes:\n\n- CLI\
      \ not installed/authenticated\n- bad working directory\n- malformed adapter\
      \ args/env\n- prompt too broad or missing constraints\n- process timeout\n\n\
      Claude-specific note:\n\n- If ANTHROPIC_API_KEY is set in adapter env or host\
      \ environment, Claude uses API-key auth instead of subscription login. Paperclip\
      \ surfaces this as a warning in environment tests, not a hard error.\n\n## 9.\
      \ Security and risk notes\n\nLocal CLI adapters run unsandboxed on the host\
      \ machine.\n\nThat means:\n\n- prompt instructions matter\n- configured credentials/env\
      \ vars are sensitive\n- working directory permissions matter\n\nStart with least\
      \ privilege where possible, and avoid exposing secrets in broad reusable prompts\
      \ unless intentionally required.\n\n## 10. Minimal setup checklist\n\n1. Choose\
      \ adapter (claude_local or codex_local).\n2. Set cwd to the target workspace.\n\
      3. Add bootstrap + normal prompt templates.\n4. Configure heartbeat policy (timer\
      \ and/or assignment wakeups).\n5. Trigger a manual wakeup.\n6. Confirm run succeeds\
      \ and session/token usage is recorded.\n7. Watch live updates and iterate prompt/config."
    word_count: 808
    char_count: 5239
  adapters/claude-local:
    title: Claude Local
    description: Claude Code local adapter setup and configuration
    category: Adapters
    url_path: /adapters/claude-local
    content: 'The claude_local adapter runs Anthropic''s Claude Code CLI locally.
      It supports session persistence, skills injection, and structured output parsing.


      ## Prerequisites


      - Claude Code CLI installed (claude command available)

      - ANTHROPIC_API_KEY set in the environment or agent config


      ## Configuration Fields


      | Field | Type | Required | Description |

      |-------|------|----------|-------------|

      | cwd | string | Yes | Working directory for the agent process (absolute path;
      created automatically if missing when permissions allow) |

      | model | string | No | Claude model to use (e.g. claude-opus-4-6) |

      | promptTemplate | string | No | Prompt used for all runs |

      | env | object | No | Environment variables (supports secret refs) |

      | timeoutSec | number | No | Process timeout (0 = no timeout) |

      | graceSec | number | No | Grace period before force-kill |

      | maxTurnsPerRun | number | No | Max agentic turns per heartbeat |

      | dangerouslySkipPermissions | boolean | No | Skip permission prompts (dev only)
      |


      ## Prompt Templates


      Templates support {} substitution:


      | Variable | Value |

      |----------|-------|

      | {} | Agent''s ID |

      | {} | Company ID |

      | {} | Current run ID |

      | {} | Agent''s name |

      | {} | Company name |


      ## Session Persistence


      The adapter persists Claude Code session IDs between heartbeats. On the next
      wake, it resumes the existing conversation so the agent retains full context.


      Session resume is cwd-aware: if the agent''s working directory changed since
      the last run, a fresh session starts instead.


      If resume fails with an unknown session error, the adapter automatically retries
      with a fresh session.


      ## Skills Injection


      The adapter creates a temporary directory with symlinks to Paperclip skills
      and passes it via --add-dir. This makes skills discoverable without polluting
      the agent''s working directory.


      ## Environment Test


      Use the "Test Environment" button in the UI to validate the adapter config.
      It checks:


      - Claude CLI is installed and accessible

      - Working directory is absolute and available (auto-created if missing and permitted)

      - API key/auth mode hints (ANTHROPIC_API_KEY vs subscription login)

      - A live hello probe (claude --print - --output-format stream-json --verbose
      with prompt Respond with hello.) to verify CLI readiness'
    word_count: 367
    char_count: 2262
  adapters/codex-local:
    title: Codex Local
    description: OpenAI Codex local adapter setup and configuration
    category: Adapters
    url_path: /adapters/codex-local
    content: 'The codex_local adapter runs OpenAI''s Codex CLI locally. It supports
      session persistence via previous_response_id chaining and skills injection through
      the global Codex skills directory.


      ## Prerequisites


      - Codex CLI installed (codex command available)

      - OPENAI_API_KEY set in the environment or agent config


      ## Configuration Fields


      | Field | Type | Required | Description |

      |-------|------|----------|-------------|

      | cwd | string | Yes | Working directory for the agent process (absolute path;
      created automatically if missing when permissions allow) |

      | model | string | No | Model to use |

      | promptTemplate | string | No | Prompt used for all runs |

      | env | object | No | Environment variables (supports secret refs) |

      | timeoutSec | number | No | Process timeout (0 = no timeout) |

      | graceSec | number | No | Grace period before force-kill |

      | dangerouslyBypassApprovalsAndSandbox | boolean | No | Skip safety checks (dev
      only) |


      ## Session Persistence


      Codex uses previous_response_id for session continuity. The adapter serializes
      and restores this across heartbeats, allowing the agent to maintain conversation
      context.


      ## Skills Injection


      The adapter symlinks Paperclip skills into the global Codex skills directory
      (~/.codex/skills). Existing user skills are not overwritten.


      ## Environment Test


      The environment test checks:


      - Codex CLI is installed and accessible

      - Working directory is absolute and available (auto-created if missing and permitted)

      - Authentication signal (OPENAI_API_KEY presence)

      - A live hello probe (codex exec --json - with prompt Respond with hello.) to
      verify the CLI can actually run'
    word_count: 251
    char_count: 1629
  adapters/creating-an-adapter:
    title: Creating an Adapter
    description: Guide to building a custom adapter
    category: Adapters
    url_path: /adapters/creating-an-adapter
    content: 'Build a custom adapter to connect Paperclip to any agent runtime.


      If you''re using Claude Code, the create-agent-adapter skill can guide you through
      the full adapter creation process interactively. Just ask Claude to create a
      new adapter and it will walk you through each step.


      ## Package Structure


      [code example]


      ## Step 1: Root Metadata


      src/index.ts is imported by all three consumers. Keep it dependency-free.


      [code example]


      ## Step 2: Server Execute


      src/server/execute.ts is the core. It receives an AdapterExecutionContext and
      returns an AdapterExecutionResult.


      Key responsibilities:


      1. Read config using safe helpers (asString, asNumber, etc.)

      2. Build environment with buildPaperclipEnv(agent) plus context vars

      3. Resolve session state from runtime.sessionParams

      4. Render prompt with renderTemplate(template, data)

      5. Spawn the process with runChildProcess() or call via fetch()

      6. Parse output for usage, costs, session state, errors

      7. Handle unknown session errors (retry fresh, set clearSession: true)


      ## Step 3: Environment Test


      src/server/test.ts validates the adapter config before running.


      Return structured diagnostics:


      - error for invalid/unusable setup

      - warn for non-blocking issues

      - info for successful checks


      ## Step 4: UI Module


      - parse-stdout.ts — converts stdout lines to TranscriptEntry[] for the run viewer

      - build-config.ts — converts form values to adapterConfig JSON

      - Config fields React component in ui/src/adapters/<name>/config-fields.tsx


      ## Step 5: CLI Module


      format-event.ts — pretty-prints stdout for paperclipai run --watch using picocolors.


      ## Step 6: Register


      Add the adapter to all three registries:


      1. server/src/adapters/registry.ts

      2. ui/src/adapters/registry.ts

      3. cli/src/adapters/registry.ts


      ## Skills Injection


      Make Paperclip skills discoverable to your agent runtime without writing to
      the agent''s working directory:


      1. **Best: tmpdir + flag** — create tmpdir, symlink skills, pass via CLI flag,
      clean up after

      2. **Acceptable: global config dir** — symlink to the runtime''s global plugins
      directory

      3. **Acceptable: env var** — point a skills path env var at the repo''s skills/
      directory

      4. **Last resort: prompt injection** — include skill content in the prompt template


      ## Security


      - Treat agent output as untrusted (parse defensively, never execute)

      - Inject secrets via environment variables, not prompts

      - Configure network access controls if the runtime supports them

      - Always enforce timeout and grace period'
    word_count: 353
    char_count: 2492
  adapters/gemini-local:
    title: Gemini Local
    description: Gemini CLI local adapter setup and configuration
    category: Adapters
    url_path: /adapters/gemini-local
    content: 'The gemini_local adapter runs Google''s Gemini CLI locally. It supports
      session persistence with --resume, skills injection, and structured stream-json
      output parsing.


      ## Prerequisites


      - Gemini CLI installed (gemini command available)

      - GEMINI_API_KEY or GOOGLE_API_KEY set, or local Gemini CLI auth configured


      ## Configuration Fields


      | Field | Type | Required | Description |

      |-------|------|----------|-------------|

      | cwd | string | Yes | Working directory for the agent process (absolute path;
      created automatically if missing when permissions allow) |

      | model | string | No | Gemini model to use. Defaults to auto. |

      | promptTemplate | string | No | Prompt used for all runs |

      | instructionsFilePath | string | No | Markdown instructions file prepended
      to the prompt |

      | env | object | No | Environment variables (supports secret refs) |

      | timeoutSec | number | No | Process timeout (0 = no timeout) |

      | graceSec | number | No | Grace period before force-kill |

      | yolo | boolean | No | Pass --approval-mode yolo for unattended operation |


      ## Session Persistence


      The adapter persists Gemini session IDs between heartbeats. On the next wake,
      it resumes the existing conversation with --resume so the agent retains context.


      Session resume is cwd-aware: if the working directory changed since the last
      run, a fresh session starts instead.


      If resume fails with an unknown session error, the adapter automatically retries
      with a fresh session.


      ## Skills Injection


      The adapter symlinks Paperclip skills into the Gemini global skills directory
      (~/.gemini/skills). Existing user skills are not overwritten.


      ## Environment Test


      Use the "Test Environment" button in the UI to validate the adapter config.
      It checks:


      - Gemini CLI is installed and accessible

      - Working directory is absolute and available (auto-created if missing and permitted)

      - API key/auth hints (GEMINI_API_KEY or GOOGLE_API_KEY)

      - A live hello probe (gemini --output-format json "Respond with hello.") to
      verify CLI readiness'
    word_count: 314
    char_count: 2001
  adapters/http:
    title: HTTP Adapter
    description: HTTP webhook adapter
    category: Adapters
    url_path: /adapters/http
    content: 'The http adapter sends a webhook request to an external agent service.
      The agent runs externally and Paperclip just triggers it.


      ## When to Use


      - Agent runs as an external service (cloud function, dedicated server)

      - Fire-and-forget invocation model

      - Integration with third-party agent platforms


      ## When Not to Use


      - If the agent runs locally on the same machine (use process, claude_local,
      or codex_local)

      - If you need stdout capture and real-time run viewing


      ## Configuration


      | Field | Type | Required | Description |

      |-------|------|----------|-------------|

      | url | string | Yes | Webhook URL to POST to |

      | headers | object | No | Additional HTTP headers |

      | timeoutSec | number | No | Request timeout |


      ## How It Works


      1. Paperclip sends a POST request to the configured URL

      2. The request body includes the execution context (agent ID, task info, wake
      reason)

      3. The external agent processes the request and calls back to the Paperclip
      API

      4. Response from the webhook is captured as the run result


      ## Request Body


      The webhook receives a JSON payload with:


      [code example]


      The external agent uses PAPERCLIP_API_URL and an API key to call back to Paperclip.'
